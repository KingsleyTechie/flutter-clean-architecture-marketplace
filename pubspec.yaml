name: flutter_clean_architecture_marketplace
description: A clean architecture Flutter marketplace boilerplate
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.0.0
  equatable: ^2.0.5
  flutter_bloc: ^8.1.2
  get_it: ^7.6.0
  injectable: ^2.1.0
  injectable_generator: ^2.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.0
  dartz: ^0.10.1
  intl: ^0.19.0
  json_annotation: ^4.8.1
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.1.0

flutter:
  uses-material-design: true
